[workspace]
members = [
    "contracts/stellar-contract",
    "backend",
]
exclude = ["apps", "packages", "integration-tests"]
resolver = "2"

[workspace.dependencies]
# Soroban dependencies
soroban-sdk = { version = "21.0.1" }

# Stellar dependencies
stellar-xdr = { version = "21.0.1" }
stellar-strkey = { version = "0.0.8" }

# Async runtime and utilities
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Configuration and environment
config = "0.14"
dotenv = "0.15"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Settle Team"]
repository = "https://github.com/Praizfotos1/Settle"
homepage = "https://settle.dev"
description = "Programmable Settlement Infrastructure on Stellar"
keywords = ["stellar", "soroban", "settlement", "escrow", "contracts"]
categories = ["web-programming", "cryptography::cryptocurrencies"]

[profile.release]
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"

[profile.release-with-panic-unwind]
inherits = "release"
panic = "unwind"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]